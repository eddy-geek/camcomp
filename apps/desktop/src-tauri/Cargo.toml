[package]
name = "camcomp-desktop"
description = "Tauri 2 desktop application for local photo comparison"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
camcomp-core = { path = "../../../crates/camcomp-core" }
heif-oxide.workspace = true
image.workspace = true
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Enabled by `tauri build`; keeps `cargo test` from needing a bundled frontend.
custom-protocol = ["tauri/custom-protocol"]
